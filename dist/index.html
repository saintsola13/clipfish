<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="clipfish" />
  <meta name="description" content="clipfish — skate camera with live fisheye" />
  <title>clipfish</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <style>
    :root {
      --bg: #050505;
      --ink: #f3f3f3;
      --mute: #9aa09a;
      --slime: #c8ff3d;
      --panel: rgba(8, 8, 8, 0.78);
      --line: rgba(200, 255, 61, 0.35);
      --danger: #ff3b5c;
      --safe: env(safe-area-inset-bottom, 12px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font-family: "DIN Alternate", "Arial Narrow", "Helvetica Neue", sans-serif;
      overflow: hidden;
    }
    #stage { position: fixed; inset: 0; background: #000; }
    #view, #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #video { opacity: 0; pointer-events: none; }
    .hud { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; z-index: 3; }
    .hud > * { pointer-events: auto; }
    .topbar, .dock {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px calc(12px + var(--safe));
      background: linear-gradient(to bottom, rgba(0,0,0,.72), transparent);
    }
    .dock { justify-content: space-between; background: linear-gradient(to top, rgba(0,0,0,.82), transparent); padding-top: 18px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .mark { width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--slime); }
    .word { font-size: 28px; letter-spacing: -0.04em; line-height: 1; text-transform: lowercase; font-weight: 800; text-shadow: 0 0 18px rgba(200,255,61,.45); }
    .word span { color: var(--slime); }
    .rec-pill { margin-left: auto; display: none; align-items: center; gap: 8px; border: 1px solid var(--danger); color: #fff; border-radius: 999px; padding: 6px 10px; font-size: 12px; letter-spacing: .12em; }
    .rec-pill.on { display: flex; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .lenses { display: flex; gap: 8px; padding: 0 14px; flex-wrap: wrap; }
    .chip, button.icon, .rec { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 8px 12px; font: inherit; cursor: pointer; }
    .chip.active { background: var(--slime); color: #111; border-color: var(--slime); font-weight: 700; }
    .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; width: 100%; }
    .side { display: flex; gap: 8px; }
    .side.right { justify-content: flex-end; }
    button.icon { width: 46px; height: 46px; border-radius: 50%; padding: 0; font-size: 16px; }
    .rec { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; background: var(--danger); box-shadow: 0 0 0 4px rgba(255,59,92,.25); }
    .rec.live { background: #111; border-color: var(--danger); }
    .slider-wrap { padding: 0 16px 8px; color: var(--mute); font-size: 12px; letter-spacing: .08em; text-transform: lowercase; }
    input[type=range] { width: 100%; accent-color: var(--slime); }
    .toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); background: #111; border: 1px solid var(--slime); color: var(--slime); padding: 8px 12px; border-radius: 10px; z-index: 5; display: none; }
    .sheet { display: none; position: fixed; inset: 0; z-index: 8; background: rgba(0,0,0,.72); align-items: flex-end; justify-content: center; }
    .sheet.open { display: flex; }
    .card { width: min(560px, 100%); background: #0c0c0c; border-top: 2px solid var(--slime); border-radius: 22px 22px 0 0; padding: 16px 16px calc(18px + var(--safe)); }
    video.replay { width: 100%; border-radius: 12px; background: #000; max-height: 48vh; }
    .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .row button { flex: 1; min-width: 90px; }
    .install { display: none; margin-left: 8px; border-color: var(--slime); color: var(--slime); }
    .install.show { display: inline-flex; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="view"></canvas>
  </div>
  <div class="hud">
    <div class="topbar">
      <div class="brand">
        <img class="mark" src="./icons/icon.svg" alt="clipfish" />
        <div class="word">clip<span>fish</span></div>
      </div>
      <button class="chip install" id="installBtn" type="button">install</button>
      <div class="rec-pill" id="recPill"><span class="dot"></span><span id="timer">00:00</span></div>
    </div>
    <div>
      <div class="lenses">
        <button class="chip" data-lens="clean" type="button">clean</button>
        <button class="chip active" data-lens="classic" type="button">classic</button>
        <button class="chip" data-lens="deep" type="button">deep</button>
      </div>
      <div class="slider-wrap">
        fisheye <span id="strengthLabel">0.58</span>
        <input id="strength" type="range" min="0" max="100" value="58" />
      </div>
      <div class="dock">
        <div class="controls">
          <div class="side">
            <button class="icon" id="flipBtn" type="button" title="flip camera">flip</button>
            <button class="icon" id="muteBtn" type="button" title="mic">mic</button>
          </div>
          <button class="rec" id="recBtn" type="button" aria-label="record"></button>
          <div class="side right">
            <button class="icon" id="shotBtn" type="button" title="still">still</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="sheet" id="sheet">
    <div class="card">
      <div class="word" style="font-size:22px;margin-bottom:10px">replay</div>
      <video class="replay" id="replay" controls playsinline></video>
      <div class="row">
        <button class="chip" id="shareBtn" type="button">share</button>
        <button class="chip" id="dlBtn" type="button">download</button>
        <button class="chip" id="closeBtn" type="button">close</button>
      </div>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
